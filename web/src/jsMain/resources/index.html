<!DOCTYPE html>
<html lang="cs">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Petr Weissar</title>
        <meta name="description" content="Senior Android vývojář, softwarový analytik, UX/UI konzultant">

        <!-- Link previews (Messenger, WhatsApp, LinkedIn, Slack…) – the image URL must be absolute -->
        <meta property="og:type" content="website">
        <link rel="canonical" href="https://weissar.dev/">
        <meta property="og:url" content="https://weissar.dev/">
        <meta property="og:title" content="Petr Weissar">
        <meta property="og:description" content="Senior Android vývojář, softwarový analytik, UX/UI konzultant">
        <meta property="og:image" content="https://weissar.dev/og-image.png">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="Logo PW">
        <meta property="og:locale" content="cs_CZ">
        <meta name="twitter:card" content="summary_large_image">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <!-- Google shows only square icons, 48px multiples -->
        <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <style>
            /* Here and not in AppStyles – Compose drops !important */
            @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after {
                    animation-duration: 1ms !important;
                    animation-delay: 0s !important;
                    animation-iteration-count: 1 !important;
                    transition-duration: 1ms !important;
                    scroll-behavior: auto !important;
                }
            }
        </style>
    </head>
    <body style="background: #141111">
        <div id="root"></div>
